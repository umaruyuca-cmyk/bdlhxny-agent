server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Touchstone 站点:七模块静态结构(首页 / + showcase/experiment/context/judging/engine/ops)
    # 旧 /docs/* 页面与 /showcase/context 已迁移,301 到新位置;/docs/*.css|js 资产保留原位。
    location = / {
        try_files /index.html =404;
    }
    location = /docs { return 301 /; }
    location = /docs/ { return 301 /; }
    location = /docs/index { return 301 /; }
    location = /docs/index.html { return 301 /; }
    location = /docs/comparison { return 301 /experiment/; }
    location = /docs/comparison.html { return 301 /experiment/; }
    location = /docs/cases { return 301 /experiment/cases; }
    location = /docs/cases.html { return 301 /experiment/cases; }
    location = /docs/eval { return 301 /judging/; }
    location = /docs/eval.html { return 301 /judging/; }
    location = /docs/agents { return 301 /engine/; }
    location = /docs/agents.html { return 301 /engine/; }
    location = /docs/skill { return 301 /engine/catalog; }
    location = /docs/skill.html { return 301 /engine/catalog; }
    location = /docs/tools { return 301 /engine/tools; }
    location = /docs/tools.html { return 301 /engine/tools; }
    location = /docs/results { return 301 /showcase/results; }
    location = /docs/results.html { return 301 /showcase/results; }
    location = /showcase/context { return 301 /context/results; }
    location = /showcase/context.html { return 301 /context/results; }
    # docs 目录只余静态资产(样式/脚本)
    location /docs/ {
        try_files $uri =404;
    }

    # 私有运行台(仅私有部署的镜像包含 lab/;公开镜像物理排除)
    location = /lab {
        return 302 /lab/;
    }
    location = /lab/ {
        try_files $uri $uri.html /lab/index.html =404;
    }

    # 七模块前缀:目录索引 + 扩展名补全,未命中回模块首页
    location = /showcase { return 302 /showcase/; }
    location = /experiment { return 302 /experiment/; }
    location = /context { return 302 /context/; }
    location = /judging { return 302 /judging/; }
    location = /engine { return 302 /engine/; }
    location = /ops { return 302 /ops/; }
    location /showcase/ {
        try_files $uri $uri.html /showcase/index.html =404;
    }
    location /experiment/ {
        try_files $uri $uri.html /experiment/index.html =404;
    }
    location /context/ {
        try_files $uri $uri.html /context/index.html =404;
    }
    location /judging/ {
        try_files $uri $uri.html /judging/index.html =404;
    }
    location /engine/ {
        try_files $uri $uri.html /engine/index.html =404;
    }
    location /ops/ {
        try_files $uri $uri.html /ops/index.html =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
