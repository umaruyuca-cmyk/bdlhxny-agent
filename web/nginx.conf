server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Touchstone 展示站：纯静态实证层（/showcase）+ 架构讲解层（/docs），无后端代理。
    location = / {
        try_files /showcase/index.html =404;
    }
    location = /showcase {
        return 302 /showcase/;
    }
    location = /showcase/ {
        try_files /showcase/index.html =404;
    }
    location /showcase/ {
        try_files $uri $uri.html /showcase/index.html =404;
    }
    location = /docs {
        return 302 /docs/;
    }
    # 私有运行台（仅私有部署的镜像包含 lab/；公开镜像物理排除）
    location = /lab {
        return 302 /lab/;
    }
    location = /docs/ {
        try_files /docs/index.html =404;
    }
    location /docs/ {
        try_files $uri $uri.html /docs/index.html =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
