<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>所有者登录 · Touchstone 内部运行台</title>
<link rel="stylesheet" href="/docs/docs.css">
<style>
  .lab-wrap { max-width: 420px; margin: 8vh auto; padding: 28px 30px; border: 1px solid #e6eaf1; border-radius: 14px; background: #fff; }
  .lab-wrap h1 { font-size: 20px; margin: 0 0 6px; }
  .lab-wrap p.sub { color: #77808f; font-size: 13px; margin: 0 0 18px; }
  .lab-wrap label { display: block; font-size: 13px; color: #3a4453; margin: 12px 0 4px; }
  .lab-wrap input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #d8dee9; border-radius: 8px; font-size: 14px; }
  .lab-wrap button { margin-top: 18px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #1f2d3d; color: #fff; font-size: 14px; cursor: pointer; }
  .lab-err { color: #b23b3b; font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<div class="lab-wrap">
  <h1>Touchstone 内部运行台</h1>
  <p class="sub">仅项目所有者。登录后按固定题号发起对照批次；本页不进入公开镜像。</p>
  <form id="loginForm">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
    <p class="lab-err" id="err"></p>
  </form>
  <p class="sub" style="margin-top:14px">运行 API 地址由部署方注入 <code>window.__RUN_API__</code>，缺省 <code>http://127.0.0.1:8090</code>。<a href="/">返回实证展示</a></p>
</div>
<script>
(function () {
  "use strict";
  var RUN_API = window.__RUN_API__ || "http://127.0.0.1:8090";
  document.getElementById("loginForm").addEventListener("submit", function (event) {
    event.preventDefault();
    var err = document.getElementById("err");
    err.textContent = "";
    fetch(RUN_API + "/api/v1/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      }),
    }).then(function (res) {
      return res.json().then(function (body) { return { status: res.status, body: body }; });
    }).then(function (outcome) {
      if (outcome.status === 200 && outcome.body.token) {
        sessionStorage.setItem("lab_token", outcome.body.token);
        location.href = "/lab/";
        return;
      }
      err.textContent = outcome.status === 503 ? "数据服务不可用，请稍后重试" : "用户名或密码错误（连续失败会锁定）";
    }).catch(function () {
      err.textContent = "无法连接运行 API：" + RUN_API;
    });
  });
})();
</script>
</body>
</html>
