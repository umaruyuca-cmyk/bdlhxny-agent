name: CI

on:
  push:
    branches: [touchstone]
  pull_request:

jobs:
  orchestrator:
    name: Touchstone Engine (lint + format + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -q

  java-data:
    name: Java Data Service (tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: touchstone_test
          POSTGRES_USER: touchstone
          POSTGRES_PASSWORD: touchstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U touchstone -d touchstone_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/touchstone_test
      DATABASE_USER: touchstone
      DATABASE_PASSWORD: touchstone
      DATA_INTERNAL_TOKEN: ci-data-internal-token
      TOUCHSTONE_INTEGRATION_TEST: "true"
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven test
        run: mvn -B -ntp test

  console:
    name: Console (contract tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        run: npm test

  compose-config:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate full local deployment
        run: docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml config -q
      - name: Validate cloud deployment
        run: docker compose --env-file deploy/.env.ci -f deploy/docker-compose.cloud.yml config -q
      - name: Validate public showcase
        run: docker compose -f deploy/docker-compose.public.yml config -q
