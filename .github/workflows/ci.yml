name: CI

on:
  push:
    branches: [main, touchstone]
  pull_request:

jobs:
  orchestrator:
    name: Touchstone Engine (lint + format + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -q

  memory-service:
    name: Memory Service (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-memory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Pytest
        run: uv run pytest -q

  java-data:
    name: Java Data Service (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Materialize application.yml
        run: cp src/main/resources/application.example.yml src/main/resources/application.yml
      - name: Maven test
        run: mvn -B -ntp test

  console:
    name: Console (contract tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        run: npm test

  compose-config:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate private dependencies
        run: docker compose --env-file deploy/.env.ci -f deploy/docker-compose.yml config -q
      - name: Validate public showcase
        run: docker compose -f deploy/docker-compose.public.yml config -q
