name: CI

on:
  push:
    branches: [main, touchstone]
  pull_request:

jobs:
  orchestrator:
    name: Touchstone Engine (lint + format + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -q

  console:
    name: Console (contract tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        run: npm test
