server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: data
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/touchstone}
    username: ${DATABASE_USER:touchstone}
    password: ${DATABASE_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

touchstone:
  internal-token: ${DATA_INTERNAL_TOKEN:}
