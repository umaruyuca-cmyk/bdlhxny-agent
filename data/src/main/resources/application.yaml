server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: data
  datasource:
    # 无默认值：缺变量即启动失败（fail-fast），本地开发经 SSH 隧道显式传值，见 data/README.md
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

touchstone:
  internal-token: ${DATA_INTERNAL_TOKEN:}
