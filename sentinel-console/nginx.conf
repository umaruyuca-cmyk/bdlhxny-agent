server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Touchstone 展示站：纯静态 /docs/ 文档页，无后端代理。
    location = / {
        try_files /docs/index.html =404;
    }
    location = /docs {
        return 302 /docs/;
    }
    location = /docs/ {
        try_files /docs/index.html =404;
    }
    location /docs/ {
        try_files $uri $uri.html /docs/index.html =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
